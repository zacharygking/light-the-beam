<script>
// Renders one named view of the finished piece. Used by tools/render_views.sh through headless
// Chrome:  scene.html?view=hero&w=1400&h=800
// Units are millimetres, Y up, the front of the piece faces +Z.
const q = new URLSearchParams(location.search);
const VIEW = q.get('view') || 'hero';
const W = +q.get('w') || 1400, H = +q.get('h') || 800;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const col = (hex) => new THREE.Color(hex).convertSRGBToLinear();

// ---- background gradient ----------------------------------------------------
{
  const c = document.createElement('canvas'); c.width = 16; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#221540'); gr.addColorStop(0.55, '#120c22'); gr.addColorStop(1, '#07050d');
  g.fillStyle = gr; g.fillRect(0, 0, 16, 256);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; scene.background = t;
}

// ---- materials ---------------------------------------------------------------
const M = {
  silver: new THREE.MeshStandardMaterial({ color: col(0xb9b5c6), roughness: 0.55, metalness: 0.12 }),
  silverDark: new THREE.MeshStandardMaterial({ color: col(0x8e8aa0), roughness: 0.5, metalness: 0.15 }),
  glass: new THREE.MeshStandardMaterial({ color: col(0x3d3760), roughness: 0.18, metalness: 0.55 }),
  ground: new THREE.MeshStandardMaterial({ color: col(0x110d1c), roughness: 0.45, metalness: 0.0 }),
  black: new THREE.MeshStandardMaterial({ color: col(0x0a0a0e), roughness: 0.35, metalness: 0.3 }),
  pcb: new THREE.MeshStandardMaterial({ color: col(0x1f6b3a), roughness: 0.6 }),
  pcbYellow: new THREE.MeshStandardMaterial({ color: col(0xd8b64a), roughness: 0.6 }),
  white: new THREE.MeshStandardMaterial({ color: col(0xf2f0f6), roughness: 0.7 }),
  wago: new THREE.MeshStandardMaterial({ color: col(0xf0f0f0), roughness: 0.3, transparent: true, opacity: 0.85 }),
  wagoLever: new THREE.MeshStandardMaterial({ color: col(0xf58a1f), roughness: 0.5 }),
  wireRed: new THREE.MeshStandardMaterial({ color: col(0xd0342c), roughness: 0.6 }),
  wireGreen: new THREE.MeshStandardMaterial({ color: col(0x2f9e44), roughness: 0.6 }),
  wireWhite: new THREE.MeshStandardMaterial({ color: col(0xe8e8e8), roughness: 0.6 }),
  wireBlack: new THREE.MeshStandardMaterial({ color: col(0x202020), roughness: 0.6 }),
  strip: new THREE.MeshStandardMaterial({ color: col(0x151515), roughness: 0.5 }),
  led: new THREE.MeshStandardMaterial({ color: col(0xf8f4ff), emissive: col(0xb48ae6), emissiveIntensity: 2.5 }),
  beam: new THREE.MeshStandardMaterial({ color: col(0xe6d3fb), emissive: col(0xa06cd5), emissiveIntensity: 1.8, roughness: 0.9, transparent: true, opacity: 0.92 }),
  beamGhost: new THREE.MeshStandardMaterial({ color: col(0xe6d3fb), emissive: col(0x8a4dd0), emissiveIntensity: 0.6, roughness: 0.9, transparent: true, opacity: 0.32 }),
  beamBase: new THREE.MeshStandardMaterial({ color: col(0xffffff), emissive: col(0xc9a2f0), emissiveIntensity: 3 }),
};

const twoSided0 = new Map();
function ds(mat) { if (!twoSided0.has(mat)) { const c = mat.clone(); c.side = THREE.DoubleSide; twoSided0.set(mat, c); } return twoSided0.get(mat); }
function mesh(geo, mat, opts = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = opts.cast !== false; m.receiveShadow = opts.receive !== false;
  return m;
}

// ---- parts -------------------------------------------------------------------
function makePlinth({ cutaway = false } = {}) {
  const g = new THREE.Group();
  const r = 115, h = 56;
  const wall = cutaway
    ? new THREE.CylinderGeometry(r, r, h, 128, 1, true, THREE.MathUtils.degToRad(100), THREE.MathUtils.degToRad(250))
    : new THREE.CylinderGeometry(r, r, h, 128, 1, false);
  const wm = M.silver.clone(); wm.side = THREE.DoubleSide;
  const w = mesh(wall, wm); w.position.y = h / 2; g.add(w);
  if (cutaway) {
    // inner skin so the cut edge reads as a 3 mm wall, and the top plate
    const inner = mesh(new THREE.CylinderGeometry(r - 3, r - 3, h - 3, 128, 1, true, THREE.MathUtils.degToRad(100), THREE.MathUtils.degToRad(250)), wm);
    inner.position.y = (h - 3) / 2; g.add(inner);
    const top = mesh(new THREE.CylinderGeometry(r, r, 3, 128), M.silver); top.position.y = h - 1.5; g.add(top);
  }
  // recess ring on top (where the arena sits)
  const ring = mesh(new THREE.TorusGeometry(110.5, 1.2, 8, 128), M.silverDark, { cast: false });
  ring.rotation.x = Math.PI / 2; ring.position.y = h + 0.2; g.add(ring);
  // sloped console on the front: face leans back 20 deg, bottom edge ~18 mm in front of the drum
  const tilt = THREE.MathUtils.degToRad(20), out = h * Math.tan(tilt);
  const sh = new THREE.Shape();   // (u = outward from drum face, v = up), stored as (-u, v) for rotateY(90)
  sh.moveTo(20, 0); sh.lineTo(-out, 0); sh.lineTo(0, h); sh.lineTo(20, h); sh.closePath();
  const wg = new THREE.ExtrudeGeometry(sh, { depth: 96, bevelEnabled: false });
  wg.rotateY(Math.PI / 2); wg.translate(-48, 0, r);
  const wedge = mesh(wg, ds(M.silver)); g.add(wedge);
  const win = new THREE.Group();
  win.position.set(0, h / 2, r + out / 2); win.rotation.x = -tilt;
  const bezel = mesh(new THREE.BoxGeometry(62, 46, 4), M.black); bezel.position.z = 1; win.add(bezel);
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(57, 43), screenMaterial()); screen.position.z = 3.05; win.add(screen);
  g.add(win);
  // cable out the back
  const path = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 12, -110), new THREE.Vector3(0, 8, -150), new THREE.Vector3(30, 2, -210), new THREE.Vector3(120, 1.5, -260)]);
  g.add(mesh(new THREE.TubeGeometry(path, 32, 2, 12), M.black));
  return g;
}

function makeBoard() {
  // ESP32-2432S028R: 86.5 x 50 PCB with the 2.8" module on top
  const g = new THREE.Group();
  g.add(mesh(new THREE.BoxGeometry(86.5, 1.6, 50), M.pcb));
  const mod = mesh(new THREE.BoxGeometry(70, 4, 52), M.black); mod.position.set(3, 2.8, 0); g.add(mod);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(57, 43), screenMaterial()); glass.rotation.x = -Math.PI / 2; glass.position.set(3, 4.85, 0); g.add(glass);
  const usb = mesh(new THREE.BoxGeometry(8, 3, 6), M.silverDark); usb.position.set(-40, -2.5, 16); g.add(usb);
  for (const z of [-8, 2, 12]) { const j = mesh(new THREE.BoxGeometry(4, 3, 6), M.white); j.position.set(-42, -2.5, z); g.add(j); }
  return g;
}

// Golden 1 Center footprint (mm, for the 220 mm print): a shield-shaped polygon with a flat
// back edge and an angled prow at the front. Shape y is -world z (front = shape -y).
const OUTLINE = [
  [-52, 96], [52, 96],            // flat back edge
  [92, 72], [108, 22],            // right shoulder
  [100, -34], [64, -84],          // right flank
  [18, -104], [-18, -104],        // prow (front)
  [-64, -84], [-100, -34],        // left flank
  [-108, 22], [-92, 72],          // left shoulder
];
function outlineShape(scale = 1) {
  const sh = new THREE.Shape();
  OUTLINE.forEach((pt, i) => { const x = pt[0] * scale, y = pt[1] * scale; i ? sh.lineTo(x, y) : sh.moveTo(x, y); });
  sh.closePath();
  return sh;
}
// vertical extrusion of the outline from y0 to y1
function slab(scale, y0, y1, mat, opts) {
  const g = new THREE.ExtrudeGeometry(outlineShape(scale), { depth: y1 - y0, bevelEnabled: false, curveSegments: 1 });
  const m = mesh(g, ds(mat), opts); m.rotation.x = -Math.PI / 2; m.position.y = y0; return m;
}
// Sawtooth version of the outline: each edge is split into ~12 mm facets that alternate
// 0 / +depth along the outward normal, so the upper cladding reads as angled metal panels.
function facetedShape(scale = 1, depth = 3.5, pitch = 12) {
  const pts = [];
  const n = OUTLINE.length;
  for (let i = 0; i < n; i++) {
    const a = OUTLINE[i].map(v => v * scale), b = OUTLINE[(i + 1) % n].map(v => v * scale);
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
    const nx = dy / len, ny = -dx / len;      // outward normal (outline is clockwise in shape space)
    const cnt = Math.max(2, Math.round(len / pitch));
    for (let k = 0; k < cnt; k++) {
      const t = k / cnt, o = (k % 2) ? depth : 0;
      pts.push([a[0] + dx * t + nx * o, a[1] + dy * t + ny * o]);
    }
  }
  const sh = new THREE.Shape();
  pts.forEach((pt, i) => i ? sh.lineTo(pt[0], pt[1]) : sh.moveTo(pt[0], pt[1]));
  sh.closePath();
  return sh;
}
function facetedSlab(scale, y0, y1, mat) {
  const g = new THREE.ExtrudeGeometry(facetedShape(scale), { depth: y1 - y0, bevelEnabled: false, curveSegments: 1 });
  g.computeVertexNormals();
  const m = mesh(g, ds(mat)); m.rotation.x = -Math.PI / 2; m.position.y = y0; return m;
}

function makeArenaBase() {
  const g = new THREE.Group();
  g.add(slab(1.0, 0, 3, M.silver));                 // floor / plaza plinth
  g.add(slab(0.985, 3, 24, M.glass));               // lower level: glass curtain wall
  // glass mullions: slim verticals every ~14 mm, and a head rail
  const n = OUTLINE.length;
  for (let i = 0; i < n; i++) {
    const a = OUTLINE[i], b = OUTLINE[(i + 1) % n];
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy), count = Math.round(len / 14);
    const ang = Math.atan2(dx, -dy);
    for (let k = 1; k < count; k++) {
      const t = k / count;
      const mu = mesh(new THREE.BoxGeometry(1, 20, 1), M.silverDark, { cast: false });
      mu.position.set(a[0] * 0.985 + dx * 0.985 * t, 13.5, -(a[1] * 0.985 + dy * 0.985 * t)); mu.rotation.y = -ang; g.add(mu);
    }
  }
  g.add(slab(1.0, 24, 27, M.silverDark));           // spandrel band between glass and cladding
  g.add(facetedSlab(1.0, 27, 56, M.silver));        // upper band: faceted metal panels
  g.add(slab(1.06, 56, 60, M.silver));              // roof edge
  // hangar doors: five tall glass bays across the flat back (plaza) edge, framed in metal
  for (let i = -2; i <= 2; i++) {
    const frame = mesh(new THREE.BoxGeometry(17, 30, 2), M.silverDark); frame.position.set(i * 19, 18, -95.5); g.add(frame);
    const door = mesh(new THREE.BoxGeometry(15, 27, 2.2), M.glass, { cast: false }); door.position.set(i * 19, 18, -95.6); g.add(door);
  }
  return g;
}

function makeRoof() {
  // the lid: a plate over the overhang, a raised inner panel with roof seams, and the beam hole
  const g = new THREE.Group();
  g.add(slab(1.07, 0, 4, M.silver));
  g.add(slab(0.82, 4, 9, M.silver));
  // solar array: rows of dark panels across the inner deck
  const pv = new THREE.MeshStandardMaterial({ color: col(0x1b2440), roughness: 0.25, metalness: 0.5 });
  for (let x = -66; x <= 66; x += 22) for (let z = -62; z <= 60; z += 16) {
    if (Math.hypot(x, z - 4) < 16) continue;   // keep clear of the beam
    if (Math.abs(x) > 44 && Math.abs(z) > 44) continue;
    const pnl = mesh(new THREE.BoxGeometry(19, 1.2, 12), pv, { cast: false }); pnl.position.set(x, 9.6, z); pnl.rotation.x = THREE.MathUtils.degToRad(-6); g.add(pnl);
  }
  // rooftop plant
  for (const [x, z, w, d] of [[-55, 60, 14, 10], [60, 50, 12, 12], [40, -70, 10, 8]]) { const b = mesh(new THREE.BoxGeometry(w, 4, d), M.silverDark); b.position.set(x, 11, z); g.add(b); }
  const hole = mesh(new THREE.TorusGeometry(7.2, 1, 8, 48), M.silverDark, { cast: false });
  hole.rotation.x = Math.PI / 2; hole.position.y = 9.3; g.add(hole);
  return g;
}

function makeSocket() {
  const g = new THREE.Group();
  g.add(mesh(new THREE.CylinderGeometry(15, 15, 8, 48), M.white));
  g.children[0].position.y = 4;
  return g;
}

function makeSpine({ withStrip = true } = {}) {
  const g = new THREE.Group();
  const bar = mesh(new THREE.BoxGeometry(10, 262, 1.6), M.white); bar.position.y = 131; g.add(bar);
  if (withStrip) {
    const strip = mesh(new THREE.BoxGeometry(10, 250, 0.8), M.strip); strip.position.set(0, 133, 1.2); g.add(strip);
    for (let i = 0; i < 15; i++) {
      const led = mesh(new THREE.BoxGeometry(5, 5, 1.2), M.led, { cast: false });
      led.position.set(0, 14 + i * 16.67, 1.9); g.add(led);
    }
  }
  return g;
}

function beamAlphaMap() {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#000'); gr.addColorStop(0.35, '#fff'); gr.addColorStop(1, '#fff');   // top -> bottom
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  return new THREE.CanvasTexture(c);
}

function glowTexture() {
  // soft vertical glow: radial falloff sideways, fades out toward the top
  const c = document.createElement('canvas'); c.width = 128; c.height = 512;
  const g = c.getContext('2d');
  for (let y = 0; y < 512; y++) {
    const v = 1 - y / 512;                     // 1 at the bottom
    const gr = g.createLinearGradient(0, 0, 128, 0);
    const a = 0.85 * Math.pow(v, 0.9);
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, `rgba(255,255,255,${a})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 511 - y, 128, 1);
  }
  return new THREE.CanvasTexture(c);
}

function makeTube({ ghost = false, glow = true } = {}) {
  const g = new THREE.Group();
  const mat = ghost ? M.beamGhost : M.beam.clone();
  if (!ghost) { mat.alphaMap = beamAlphaMap(); mat.transparent = true; }
  const foot = mesh(new THREE.CylinderGeometry(8, 8, 3, 48), ghost ? mat : M.beam, { cast: false }); foot.position.y = 1.5; g.add(foot);
  const body = mesh(new THREE.CylinderGeometry(6, 6, 247, 48), mat, { cast: false }); body.position.y = 3 + 123.5; g.add(body);
  if (glow && !ghost) {
    const gm = new THREE.MeshBasicMaterial({ map: glowTexture(), color: col(0x9b5fd6), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.75 });
    const bill = new THREE.Mesh(new THREE.PlaneGeometry(110, 300), gm); bill.position.y = 150; bill.name = 'billboard'; g.add(bill);
    const tex = haloTexture();
    const base = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color: col(0xc9a2f0), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.8 }));
    base.scale.set(110, 110, 1); base.position.y = 6; g.add(base);
    const l1 = new THREE.PointLight(col(0x9b5fd6), 1.6, 420, 2); l1.position.y = 20; g.add(l1);
    const l2 = new THREE.PointLight(col(0x9b5fd6), 0.6, 500, 2); l2.position.y = 160; g.add(l2);
  }
  return g;
}

function makeWago(len = 18) {
  const g = new THREE.Group();
  g.add(mesh(new THREE.BoxGeometry(len, 9, 13), M.wago));
  for (let i = 0; i < 3; i++) { const lv = mesh(new THREE.BoxGeometry(4, 3, 5), M.wagoLever); lv.position.set(-len / 2 + 4 + i * 5, 6, 3); g.add(lv); }
  return g;
}

function wire(points, mat, r = 0.9) {
  const path = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  return mesh(new THREE.TubeGeometry(path, 40, r, 10), mat, { cast: false });
}

function haloTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

// LIVE screen drawn to a canvas, same layout as the firmware
function screenMaterial() {
  const c = document.createElement('canvas'); c.width = 640; c.height = 480;
  const g = c.getContext('2d');
  const s = 2;
  const gr = g.createLinearGradient(0, 0, 640, 480); gr.addColorStop(0, '#1a1030'); gr.addColorStop(1, '#0b0814');
  g.fillStyle = gr; g.fillRect(0, 0, 640, 480);
  const rr = (x, y, w, h, r, f) => { g.fillStyle = f; g.beginPath(); g.roundRect(x * s, y * s, w * s, h * s, r * s); g.fill(); };
  rr(16, 16, 56, 20, 10, '#3a0f1a');
  g.fillStyle = '#ff3b5c'; g.beginPath(); g.arc(28 * s, 26 * s, 4 * s, 0, 7); g.fill();
  g.font = `700 ${11 * s}px Barlow`; g.fillStyle = '#ff8a9e'; g.textAlign = 'left'; g.fillText('LIVE', 40 * s, 30 * s);
  g.font = `700 ${18 * s}px "Barlow Condensed"`; g.fillStyle = '#fff'; g.textAlign = 'center'; g.fillText('Q4  ·  2:31', 160 * s, 31 * s);
  rr(16, 56, 136, 4, 2, '#5a2d81'); rr(168, 56, 136, 4, 2, '#fdb927');
  g.font = `600 ${14 * s}px Barlow`; g.fillStyle = '#b48ae6'; g.fillText('S A C', 84 * s, 84 * s); g.fillStyle = '#8d86a3'; g.fillText('L A L', 236 * s, 84 * s);
  g.font = `700 ${84 * s}px "Barlow Condensed"`; g.fillStyle = '#fff'; g.fillText('102', 84 * s, 170 * s); g.fillStyle = '#8d86a3'; g.fillText('98', 236 * s, 170 * s);
  rr(76, 192, 16, 4, 2, '#b48ae6');
  g.font = `600 ${11 * s}px Barlow`; g.fillStyle = '#8d86a3'; g.fillText('GOLDEN 1 CENTER · SACRAMENTO', 160 * s, 224 * s);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
  return new THREE.MeshBasicMaterial({ map: t, toneMapped: false });
}


// ---- real Printables meshes -------------------------------------------------------
// Binary STL -> BufferGeometry. Files are fetched relative to this page; headless Chrome
// needs --allow-file-access-from-files for file:// (tools/render_views.sh passes it).
async function loadStl(url) {
  const buf = await (await fetch(url)).arrayBuffer();
  const dv = new DataView(buf); const n = dv.getUint32(80, true);
  const pos = new Float32Array(n * 9);
  for (let i = 0; i < n; i++) { const o = 84 + i * 50; for (let k = 0; k < 9; k++) pos[i * 9 + k] = dv.getFloat32(o + 12 + k * 4, true); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.computeVertexNormals(); return g;
}
// STL frame -> scene frame: STL z is up; the flat edge (STL +x) goes to the back (-z).
// Footprint centre in STL coords from tools/measure_arena.py.
const ARENA_CX = 153.4, ARENA_CY = 151.0;
function placeArena(geo, y) {
  geo.translate(-ARENA_CX, -ARENA_CY, 0);
  geo.rotateX(-Math.PI / 2);          // z up -> y up  (x, y, z) -> (x, z, -y)
  geo.rotateY(Math.PI);               // flat edge (+x) -> back (-z)
  const m = mesh(geo, M.silver); m.position.y = y; return m;
}
const REAL = {};
async function loadReal() {
  try {
    const [b, l] = await Promise.all([loadStl('../../models/printables/base_220.stl'), loadStl('../../models/printables/lid_220_nohole.stl')]);
    REAL.base = b; REAL.lid = l;
    // the lid file has its own origin; centre it on its bbox and drop it onto the inner box (49.5 mm)
    l.computeBoundingBox(); const c = l.boundingBox.getCenter(new THREE.Vector3());
    l.translate(-c.x, -c.y, -l.boundingBox.min.z);
    l.translate(1.5, -3.9, 0);          // well centre offset
    l.rotateX(-Math.PI / 2); l.rotateY(Math.PI);
  } catch (e) { console.log('real meshes unavailable, using the stand-in: ' + e); }
}
function realBase(y) { return placeArena(REAL.base, y); }
function realLid(y) { const m = mesh(REAL.lid, M.silver); m.position.y = y; return m; }

// ---- lights ------------------------------------------------------------------
scene.add(new THREE.HemisphereLight(col(0x7a66b0), col(0x0a0710), 0.55));
const key = new THREE.DirectionalLight(col(0xfff2e2), 1.05);
key.position.set(350, 520, 420); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -450, right: 450, top: 450, bottom: -450, near: 100, far: 1800 });
key.shadow.bias = -0.0006; key.shadow.radius = 4;
scene.add(key);
const fill = new THREE.DirectionalLight(col(0x9a8ad0), 0.35); fill.position.set(-450, 250, 250); scene.add(fill);
const rim = new THREE.PointLight(col(0xb48ae6), 0.9, 1500, 1.5); rim.position.set(-100, 320, -380); scene.add(rim);

// ---- ground ------------------------------------------------------------------
const ground = mesh(new THREE.PlaneGeometry(4000, 4000), M.ground, { cast: false });
ground.rotation.x = -Math.PI / 2; scene.add(ground);

// ---- assemble the requested view -----------------------------------------------
async function buildScene() {
const camera = new THREE.PerspectiveCamera(30, W / H, 5, 5000);
function look(px, py, pz, tx, ty, tz, fov = 30) { camera.fov = fov; camera.position.set(px, py, pz); camera.lookAt(tx, ty, tz); camera.updateProjectionMatrix(); }

await loadReal();
const real = !!REAL.base;
const ARENA_Y = 56, ROOF_Y = ARENA_Y + (real ? 44.5 : 60), TUBE_Y = ARENA_Y + 2 + 8;   // tube foot sits in the socket on the arena floor
const arenaBase = () => real ? realBase(0) : makeArenaBase();
const arenaRoof = () => real ? realLid(0) : makeRoof();

if (VIEW === 'hero' || VIEW === 'screen') {
  const plinth = makePlinth(); scene.add(plinth);
  const base = arenaBase(); base.position.y = ARENA_Y; scene.add(base);
  const roof = arenaRoof(); roof.position.y = ROOF_Y; scene.add(roof);
  const tube = makeTube(); tube.position.y = TUBE_Y; scene.add(tube);
  if (VIEW === 'hero') look(300, 265, 500, 0, 100, 0, 34);
  else look(120, 110, 320, 0, 35, 80, 24);
}

if (VIEW === 'exploded') {
  ground.position.y = -90;
  const plinth = makePlinth(); scene.add(plinth);
  const lid = mesh(new THREE.CylinderGeometry(108, 108, 2.4, 96), M.silver); lid.position.y = -50; scene.add(lid);
  const base = arenaBase(); base.position.y = ARENA_Y + 60; scene.add(base);
  const socket = makeSocket(); socket.position.y = ARENA_Y + 60 + 3; scene.add(socket);
  const roof = arenaRoof(); roof.position.y = ROOF_Y + 150; scene.add(roof);
  const spine = makeSpine(); spine.position.y = ROOF_Y + 150 + 80 + 8; spine.position.x = 0; scene.add(spine);
  const tube = makeTube({ ghost: true }); tube.position.y = ROOF_Y + 150 + 80; scene.add(tube);
  // dashed axis
  const axis = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -60, 0), new THREE.Vector3(0, 720, 0)]), new THREE.LineDashedMaterial({ color: 0xb48ae6, dashSize: 8, gapSize: 8 }));
  axis.computeLineDistances(); scene.add(axis);
  look(430, 300, 600, 0, 250, 0, 52);
}

if (VIEW === 'beam') {
  // tube ghosted so the spine and strip show, socket below
  const socket = makeSocket(); scene.add(socket);
  const spine = makeSpine(); spine.position.y = 9; scene.add(spine);
  const tube = makeTube({ ghost: true }); tube.position.y = 8; scene.add(tube);
  look(220, 200, 330, 0, 120, 0, 34);
}

if (VIEW === 'strip') {
  // strip cut to 15 LEDs, spine beside it, before sticking
  const strip = mesh(new THREE.BoxGeometry(250, 0.8, 10), M.strip); strip.position.set(0, 0.4, 20); scene.add(strip);
  for (let i = 0; i < 15; i++) { const led = mesh(new THREE.BoxGeometry(5, 1.2, 5), M.led, { cast: false }); led.position.set(-117 + i * 16.67, 1.3, 20); scene.add(led); }
  const spine = makeSpine({ withStrip: false }); spine.rotation.z = -Math.PI / 2; spine.position.set(-131, 0.8, -12); scene.add(spine);
  scene.add(wire([[-126, 0.6, 20], [-150, 0.6, 22], [-175, 0.6, 18]], M.wireRed));
  scene.add(wire([[-126, 0.6, 18], [-150, 0.6, 17], [-175, 0.6, 12]], M.wireGreen));
  scene.add(wire([[-126, 0.6, 22], [-150, 0.6, 27], [-175, 0.6, 26]], M.wireWhite));
  look(60, 170, 220, -20, 0, 5, 34);
}

if (VIEW === 'cutaway') {
  const plinth = makePlinth({ cutaway: true }); scene.add(plinth);
  const board = makeBoard(); board.rotation.x = THREE.MathUtils.degToRad(70); board.position.set(0, 28, 118); scene.add(board);
  for (let i = 0; i < 3; i++) { const w = makeWago(); w.position.set(-40 + i * 22, 4.5, -60); scene.add(w); }
  scene.add(wire([[-30, 8, -62], [-20, 20, -20], [-10, 30, 40], [-5, 34, 88]], M.wireRed));
  scene.add(wire([[-8, 8, -62], [0, 22, -20], [5, 32, 40], [8, 36, 88]], M.wireWhite));
  scene.add(wire([[14, 8, -62], [20, 24, -20], [18, 34, 40], [20, 38, 88]], M.wireGreen));
  look(360, 190, 300, 0, 22, 30, 28);
}

if (VIEW === 'wiring') {
  const board = makeBoard(); board.position.set(0, 3, 0); scene.add(board);
  const strip = mesh(new THREE.BoxGeometry(80, 0.8, 10), M.strip); strip.position.set(-20, 0.4, 95); scene.add(strip);
  for (let i = 0; i < 5; i++) { const led = mesh(new THREE.BoxGeometry(5, 1.2, 5), M.led, { cast: false }); led.position.set(-54 + i * 16.67, 1.3, 95); scene.add(led); }
  for (let i = 0; i < 3; i++) { const w = makeWago(); w.position.set(-80 + i * 24, 4.5, 50); scene.add(w); }
  // board pigtail (left edge) to WAGOs, strip leads to WAGOs
  scene.add(wire([[-46, 2, -8], [-70, 3, 10], [-84, 4, 43]], M.wireRed));
  scene.add(wire([[-46, 2, 2], [-64, 3, 14], [-60, 4, 43]], M.wireBlack));
  scene.add(wire([[-46, 2, 12], [-50, 3, 22], [-36, 4, 43]], M.wireGreen));
  scene.add(wire([[-60, 0.6, 92], [-70, 2, 75], [-84, 4, 57]], M.wireRed));
  scene.add(wire([[-60, 0.6, 95], [-62, 2, 78], [-60, 4, 57]], M.wireWhite));
  scene.add(wire([[-60, 0.6, 98], [-48, 2, 80], [-36, 4, 57]], M.wireGreen));
  look(40, 170, 190, -20, 0, 40, 34);
}

if (VIEW === 'lid') {
  const base = arenaBase(); scene.add(base);
  const roof = arenaRoof(); roof.position.y = 60 + 40; scene.add(roof);
  const socket = makeSocket(); socket.position.y = 3; scene.add(socket);
  const tube = makeTube({ ghost: false, glow: false }); tube.position.y = 11; scene.add(tube);
  look(230, 260, 300, 0, 90, 0, 32);
}

if (VIEW === 'plinth_top') {
  const plinth = makePlinth(); scene.add(plinth);
  const base = arenaBase(); base.position.y = ARENA_Y + 70; scene.add(base);
  look(300, 300, 420, 0, 70, 0, 30);
}

return camera;
}

// ---- render once fonts and meshes are in ---------------------------------------
buildScene().then(camera => document.fonts.load('700 40px "Barlow Condensed"').then(() => document.fonts.load('600 20px Barlow')).then(() => {
  // rebuild screen textures now that fonts exist
  scene.traverse(o => { if (o.material && o.material.map && o.material.map.image && o.material.map.image.width === 640) { o.material = screenMaterial(); } });
  scene.traverse(o => { if (o.name === 'billboard') { const p = new THREE.Vector3(); o.getWorldPosition(p); o.rotation.y = Math.atan2(camera.position.x - p.x, camera.position.z - p.z); } });
  renderer.render(scene, camera);
  document.title = 'done:' + VIEW;
}));
</script>
</body>
</html>
