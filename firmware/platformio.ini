; Kings "Light the Beam" scoreboard firmware
; Target: ESP32-2432S028R "Cheap Yellow Display" (ESP32-WROOM-32, 2.8" ILI9341, XPT2046 touch)
;
;   pio run -e cyd -t upload          flash the real firmware
;   pio run -e cyd_demo -t upload     flash demo mode (cycles NEXT → LIVE → FINAL, no WiFi needed)
;   pio test -e native                run the parser, beam-policy and win-probability tests on your Mac
;   pio device monitor -b 115200      serial log

[platformio]
default_envs = cyd

[env]
build_flags =
  -D CORE_DEBUG_LEVEL=1

; ---------------------------------------------------------------------------
; Shared settings for the CYD hardware
; ---------------------------------------------------------------------------
[cyd_common]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; 3 MB app partition (no OTA): LVGL + fonts + 30 team logos need the room
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
; Binned play-by-play table the board refits the win-probability model from on boot (247 KB)
board_build.embed_files = data/winprob_train.bin
lib_deps =
  lvgl/lvgl@9.2.2
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@7.2.1
  fastled/FastLED@3.9.4
  tzapu/WiFiManager@2.0.17
build_src_filter = +<*> -<../test/>
build_flags =
  ${env.build_flags}
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -I include
  ; ---- TFT_eSPI setup for the CYD (ESP32-2432S028R) ----
  ; The panel hangs off GPIO 12/13/14/15, which are the HSPI pins; the touch controller uses its
  ; own pins on VSPI (touch.cpp). Without USE_HSPI_PORT both drivers would claim VSPI.
  -D USER_SETUP_LOADED=1
  -D USE_HSPI_PORT=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D TFT_RGB_ORDER=TFT_BGR
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D LOAD_GLCD=1
  -D SMOOTH_FONT=1
  ; If your board shows inverted colors (the newer "2 USB" CYD variant with an ST7789),
  ; comment ILI9341_2_DRIVER above and use:  -D ST7789_DRIVER=1 -D TFT_INVERSION_ON=1
  ; ---- FastLED: use RMT, keep interrupts happy alongside WiFi ----
  -D FASTLED_RMT_MAX_CHANNELS=1
  -D FASTLED_ESP32_FLASH_LOCK=1

[env:cyd]
extends = cyd_common

[env:cyd_demo]
extends = cyd_common
build_flags =
  ${cyd_common.build_flags}
  -D DEMO_MODE=1

; ---------------------------------------------------------------------------
; Native tests for the parser (runs on the Mac, no hardware)
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
lib_deps =
  bblanchon/ArduinoJson@7.2.1
build_src_filter = +<kings_parse.cpp>
build_flags =
  -std=c++17
  -D NATIVE_TEST
  -D FIXTURE_DIR="\"${PROJECT_DIR}/test/fixtures\""
  -D DATA_DIR="\"${PROJECT_DIR}/data\""
  -I include
  -I src
